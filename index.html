<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文稿风格优化器 · 高管风格</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg: #f8f9fc;
            --card: #ffffff;
            --primary: #c41230;
            --primary-light: #e8354a;
            --primary-dark: #9a0e26;
            --accent: #1a1a2e;
            --text: #2d2d3a;
            --text-secondary: #6b7280;
            --border: #e5e7eb;
            --shadow: 0 4px 24px rgba(0,0,0,0.06);
            --shadow-lg: 0 12px 40px rgba(196,18,48,0.12);
            --radius: 16px;
            --radius-sm: 10px;
            /* 蓝色选中态 */
            --select: #2563eb;
            --select-light: #3b82f6;
            --select-bg: rgba(37,99,235,0.04);
        }

        body {
            font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* ===== 背景装饰 ===== */
        .bg-decor {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }
        .bg-decor::before {
            content: '';
            position: absolute;
            top: -20%; right: -10%;
            width: 600px; height: 600px;
            background: radial-gradient(circle, rgba(196,18,48,0.06) 0%, transparent 70%);
            border-radius: 50%;
        }
        .bg-decor::after {
            content: '';
            position: absolute;
            bottom: -10%; left: -5%;
            width: 400px; height: 400px;
            background: radial-gradient(circle, rgba(26,26,46,0.04) 0%, transparent 70%);
            border-radius: 50%;
        }

        /* ===== Header ===== */
        header {
            position: relative;
            z-index: 10;
            padding: 32px 40px 0;
        }
        .header-inner {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .logo-group {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .logo-icon {
            width: 48px; height: 48px;
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            border-radius: 14px;
            display: flex; align-items: center; justify-content: center;
            font-size: 22px;
            color: white;
            box-shadow: 0 4px 16px rgba(196,18,48,0.25);
        }
        .logo-text h1 {
            font-size: 22px;
            font-weight: 900;
            color: var(--accent);
            letter-spacing: -0.5px;
        }
        .logo-text p {
            font-size: 12px;
            color: var(--text-secondary);
            font-weight: 400;
            margin-top: 2px;
        }
        .badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 14px;
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            color: white;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
        }

        /* ===== Main ===== */
        main {
            position: relative;
            z-index: 10;
            max-width: 1200px;
            margin: 0 auto;
            padding: 32px 40px 60px;
        }

        /* ===== 场景选择 ===== */
        .scene-section {
            margin-bottom: 28px;
        }
        .scene-label {
            font-size: 14px;
            font-weight: 700;
            color: var(--text-secondary);
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .scene-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
            gap: 10px;
        }
        .scene-card {
            position: relative;
            padding: 16px 18px;
            background: var(--card);
            border: 2px solid var(--border);
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.4,0,0.2,1);
            user-select: none;
        }
        .scene-card:hover {
            border-color: var(--select-light);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(37,99,235,0.1);
        }
        .scene-card.active {
            border-color: var(--select);
            background: linear-gradient(135deg, rgba(37,99,235,0.06), rgba(37,99,235,0.02));
            box-shadow: 0 4px 16px rgba(37,99,235,0.12);
        }
        .scene-card.active::after {
            content: '✓';
            position: absolute;
            top: 8px; right: 10px;
            width: 20px; height: 20px;
            background: var(--select);
            color: white;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 11px;
            font-weight: 700;
        }
        .scene-card .scene-emoji {
            font-size: 24px;
            margin-bottom: 6px;
        }
        .scene-card .scene-name {
            font-size: 14px;
            font-weight: 700;
            color: var(--text);
        }
        .scene-card .scene-desc {
            font-size: 11px;
            color: var(--text-secondary);
            margin-top: 3px;
            line-height: 1.4;
        }
        .brand-chip {
            padding: 8px 20px;
            background: var(--card);
            border: 2px solid var(--border);
            border-radius: 50px;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.2s;
            user-select: none;
        }
        .brand-chip:hover {
            border-color: var(--select-light);
            color: var(--select);
        }
        .brand-chip.active {
            background: var(--select);
            border-color: var(--select);
            color: white;
            box-shadow:0 4px 16px rgba(37,99,235,0.25);
        }
        .brand-dropdown-wrap {
            position: relative;
            display: inline-flex;
        }
        .brand-dropdown {
            display: none;
            position: absolute;
            top: calc(100% + 8px);
            left: 50%;
            transform: translateX(-50%);
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            box-shadow: 0 8px 32px rgba(0,0,0,0.12);
            z-index: 100;
            max-height: 280px;
            overflow-y: auto;
            min-width: 180px;
            padding: 6px 0;
        }
        .brand-dropdown.show {
            display: block;
        }
        .brand-dropdown::-webkit-scrollbar { width: 5px; }
        .brand-dropdown::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 3px; }
        .brand-option {
            padding: 8px 18px;
            font-size: 13px;
            color: var(--text);
            cursor: pointer;
            white-space: nowrap;
            transition: background 0.15s;
        }
        .brand-option:hover {
            background: rgba(37,99,235,0.08);
            color: var(--select);
        }
        .brand-option.selected {
            background: rgba(37,99,235,0.12);
            color: var(--select);
            font-weight: 600;
        }
        .brand-chip.has-dropdown::after {
            content: '▾';
            margin-left: 6px;
            font-size: 11px;
        }

        /* ===== 编辑器 ===== */
        .editor-stack {
            display: flex;
            flex-direction: column;
            gap: 0;
        }

        .editor-panel {
            background: var(--card);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        .panel-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 22px;
            border-bottom: 1px solid var(--border);
        }
        .panel-title {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            font-weight: 700;
            color: var(--text);
        }
        .panel-title .dot {
            width: 8px; height: 8px;
            border-radius: 50%;
        }
        .input-dot { background: var(--primary); }
        .output-dot { background: #10b981; }
        .char-count {
            font-size: 12px;
            color: var(--text-secondary);
            font-variant-numeric: tabular-nums;
        }

        textarea {
            width: 100%;
            min-height: 320px;
            padding: 20px 22px;
            border: none;
            outline: none;
            resize: vertical;
            font-family: inherit;
            font-size: 15px;
            line-height: 1.8;
            color: var(--text);
            background: transparent;
        }
        textarea::placeholder {
            color: #c5c8d0;
        }

        .output-area {
            min-height: 320px;
            padding: 20px 22px;
            font-size: 15px;
            line-height: 1.9;
            color: var(--text);
            overflow-y: auto;
            white-space: pre-wrap;
        }
        .output-placeholder {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 300px;
            color: #c5c8d0;
            text-align: center;
        }
        .output-placeholder .ph-icon {
            font-size: 48px;
            margin-bottom: 12px;
            opacity: 0.5;
        }
        .output-placeholder .ph-text {
            font-size: 14px;
            line-height: 1.6;
        }

        /* ===== 按钮 ===== */
        .action-bar {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
            padding: 20px 0;
        }
        .btn-optimize {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 16px 48px;
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            color: white;
            border: none;
            border-radius: 50px;
            font-size: 16px;
            font-weight: 700;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4,0,0.2,1);
            box-shadow: 0 6px 24px rgba(196,18,48,0.3);
            position: relative;
            overflow: hidden;
        }
        .btn-optimize::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, transparent, rgba(255,255,255,0.15));
            opacity: 0;
            transition: opacity 0.3s;
        }
        .btn-optimize:hover::before { opacity: 1; }
        .btn-optimize:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 32px rgba(196,18,48,0.4);
        }
        .btn-optimize:active {
            transform: translateY(0);
        }
        .btn-optimize:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        .btn-optimize .btn-arrow {
            transition: transform 0.3s;
        }
        .btn-optimize:hover .btn-arrow {
            transform: translateX(3px);
        }

        .btn-copy {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 16px 32px;
            background: var(--card);
            color: var(--text);
            border: 2px solid var(--border);
            border-radius: 50px;
            font-size: 14px;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.25s;
        }
        .btn-copy:hover {
            border-color: var(--primary);
            color: var(--primary);
            transform: translateY(-1px);
        }

        /* ===== 加载动画 ===== */
        .loading-overlay {
            display: none;
            position: absolute;
            inset: 0;
            background: rgba(255,255,255,0.85);
            backdrop-filter: blur(4px);
            z-index: 20;
            align-items: center;
            justify-content: center;
            border-radius: var(--radius);
        }
        .loading-overlay.show {
            display: flex;
        }
        .spinner {
            display: flex;
            gap: 6px;
        }
        .spinner span {
            width: 10px; height: 10px;
            background: var(--primary);
            border-radius: 50%;
            animation: bounce 1.2s infinite ease-in-out;
        }
        .spinner span:nth-child(2) { animation-delay: 0.15s; }
        .spinner span:nth-child(3) { animation-delay: 0.3s; }
        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0.5); opacity: 0.4; }
            40% { transform: scale(1); opacity: 1; }
        }

        /* ===== 结果高亮 ===== */
        .hl-phrase {
            color: var(--primary);
            font-weight: 700;
        }
        .hl-data {
            background: rgba(196,18,48,0.08);
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: 600;
        }

        /* ===== Toast ===== */
        .toast {
            position: fixed;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%) translateY(80px);
            background: var(--accent);
            color: white;
            padding: 12px 28px;
            border-radius: 50px;
            font-size: 14px;
            font-weight: 500;
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.4,0,0.2,1);
            z-index: 999;
            pointer-events: none;
        }
        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* ===== 打字动画 ===== */
        .typing-cursor::after {
            content: '|';
            color: var(--primary);
            font-weight: 300;
            animation: blink 0.8s infinite;
        }
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        /* ===== 响应式 ===== */
        @media (max-width: 640px) {
            header, main { padding-left: 20px; padding-right: 20px; }
            .header-inner { flex-direction: column; align-items: flex-start; gap: 12px; }
            .scene-grid { grid-template-columns: 1fr 1fr; }
            .btn-optimize { padding: 14px 32px; font-size: 15px; }
        }
    </style>
</head>
<body>
    <div class="bg-decor"></div>

    <header>
        <div class="header-inner">
            <div class="logo-group">
                <div class="logo-icon">✍️</div>
                <div class="logo-text">
                    <h1>文稿风格优化器</h1>
                    <p>一键对齐高管视角 &amp; 品牌风格</p>
                </div>
            </div>
            <div class="badge">
                <span>🔥</span>
                <span>专为车企高管打造的内容智造引擎</span>
            </div>
        </div>
    </header>

    <main>
        <!-- 品牌选择 -->
        <div class="brand-section" style="margin-bottom: 28px;">
            <div class="scene-label">选择品牌</div>
            <div style="display:flex; gap:10px; flex-wrap:wrap; align-items:flex-start;" id="brandBar">
                <div class="brand-chip active" data-brand="dfrq" onclick="selectBrand(this)">东风日产</div>
                <div class="brand-chip" data-brand="dfms" onclick="selectBrand(this)">东风猛士</div>
                <div class="brand-chip" data-brand="yipai" onclick="selectBrand(this)">奕派科技</div>
                <div class="brand-chip" data-brand="dongfeng" onclick="selectBrand(this)">东风集团</div>
                <div class="brand-chip" data-brand="lantuo" onclick="selectBrand(this)">岚图汽车</div>
                <div class="brand-chip" data-brand="changan" onclick="selectBrand(this)">长安启源</div>
                <div class="brand-chip" data-brand="gqhaobo" onclick="selectBrand(this)">广汽昊铂</div>
                <div class="brand-dropdown-wrap">
                    <div class="brand-chip has-dropdown" data-brand="other" id="brandOther" onclick="toggleBrandDropdown(event)">其他</div>
                    <div class="brand-dropdown" id="brandDropdown"></div>
                </div>
            </div>
        </div>

        <!-- 场景选择 -->
        <div class="scene-section">
            <div class="scene-label">选择场景</div>
            <div class="scene-grid" id="sceneGrid">
                <div class="scene-card active" data-scene="launch">
                    <div class="scene-emoji">🚗</div>
                    <div class="scene-name">发布会</div>
                    <div class="scene-desc">金句暴论 + 数据砸脸</div>
                </div>
                <div class="scene-card" data-scene="media">
                    <div class="scene-emoji">🎤</div>
                    <div class="scene-name">媒体沟通采访</div>
                    <div class="scene-desc">脱口秀式 + 自嘲幽默</div>
                </div>
                <div class="scene-card" data-scene="mobilize">
                    <div class="scene-emoji">🔥</div>
                    <div class="scene-name">内宣动员</div>
                    <div class="scene-desc">战斗鼓动 + 三连排比</div>
                </div>
                <div class="scene-card" data-scene="social">
                    <div class="scene-emoji">📱</div>
                    <div class="scene-name">新媒体文案</div>
                    <div class="scene-desc">短平快 + 互动反问</div>
                </div>
            </div>
        </div>

        <!-- 编辑器（上下布局） -->
        <div class="editor-stack">
            <div class="editor-panel">
                <div class="panel-header">
                    <div class="panel-title">
                        <span class="dot input-dot"></span>
                        原始文稿
                    </div>
                    <span class="char-count" id="charCount">0 字</span>
                </div>
                <textarea id="inputText" placeholder="在这里粘贴需要优化的文稿……&#10;&#10;例如：我们的产品非常优秀，续航里程很长，智能座舱体验很好，欢迎大家购买。"></textarea>
            </div>

            <!-- 操作按钮（在输入框和结果框之间） -->
            <div class="action-bar">
                <button class="btn-optimize" id="btnOptimize" onclick="handleOptimize()">
                    开始优化
                    <span class="btn-arrow">→</span>
                </button>
                <button class="btn-copy" id="btnCopy" onclick="handleCopy()" style="display:none;">
                    📋 复制结果
                </button>
            </div>

            <div class="editor-panel" style="position:relative;">
                <div class="panel-header">
                    <div class="panel-title">
                        <span class="dot output-dot"></span>
                        高管风格优化输出
                    </div>
                    <span class="char-count" id="outputCharCount">0 字</span>
                </div>
                <div class="output-area" id="outputArea">
                    <div class="output-placeholder">
                        <div class="ph-icon">🎯</div>
                        <div class="ph-text">选择品牌和场景，输入文稿<br>点击上方按钮，一键对齐高管风格</div>
                    </div>
                </div>
                <div class="loading-overlay" id="loadingOverlay">
                    <div class="spinner">
                        <span></span><span></span><span></span>
                    </div>
                </div>
            </div>
        </div>

    </main>

    <!-- Toast -->
    <div class="toast" id="toast"></div>

    <script>
    // ===== 全局状态 =====
    let currentBrand = '';
    let currentBrandName = '';
    let currentScene = 'launch';
    let isOptimizing = false;
    let resultText = '';

    // ===== 常见汽车品牌（按拼音排序）=====
    const commonCarBrands = [
        '阿维塔','奥迪','宝马','保时捷','北京越野','北汽极狐',
        '奔腾','奔驰','比亚迪','标致','别克','宾利','布加迪',
        '长安','长城','大众','道奇','东风','东风风神','东风风行',
        '菲亚特','丰田','福特','广汽传祺','广汽埃安','海马',
        '韩燕','恒驰','红旗','鸿蒙智行','捷豹','捷达','吉利',
        '江淮','捷尼赛思','金杯','凯迪拉克','克莱斯勒','理想',
        '林肯','领克','路虎','雷诺','猎豹','零跑',
        '路特斯','玛莎拉蒂','马自达','迈巴赫','迈凯伦','迷你',
        '名爵','哪吒','讴歌','欧宝','欧拉','帕加尼',
        '起亚','奇瑞','启辰','日产','荣威','如祺出行',
        '睿蓝','萨博','三菱','斯巴鲁','斯柯达','Smart',
        '坦克','特斯拉','腾势','天津一汽','万科','蔚来',
        '沃尔沃','五菱','现代','雪佛兰','雪铁龙','讯飞',
        '亚星','扬子','一汽','依维柯','英菲尼迪','宇通',
        '远程','远景','长安深蓝','成功'
    ].sort((a, b) => a.localeCompare(b, 'zh-CN'));

    // ===== 初始化品牌下拉 =====
    function initBrandDropdown() {
        const dd = document.getElementById('brandDropdown');
        commonCarBrands.forEach(name => {
            const div = document.createElement('div');
            div.className = 'brand-option';
            div.textContent = name;
            div.onclick = (e) => {
                e.stopPropagation();
                selectOtherBrand(name);
            };
            dd.appendChild(div);
        });
    }

    // ===== 切换"其他"下拉显示 =====
    function toggleBrandDropdown(e) {
        e.stopPropagation();
        const dd = document.getElementById('brandDropdown');
        const isShow = dd.classList.contains('show');
        closeAllDropdowns();
        if (!isShow) {
            dd.classList.add('show');
            // 高亮当前选中
            dd.querySelectorAll('.brand-option').forEach(o => {
                o.classList.toggle('selected', o.textContent === currentBrandName);
            });
        }
    }

    // ===== 选择"其他"中的品牌 =====
    function selectOtherBrand(name) {
        currentBrand = 'other:' + name;
        currentBrandName = name;
        // 更新"其他"芯片文字
        const chip = document.getElementById('brandOther');
        chip.textContent = name.length > 4 ? name.slice(0, 4) + '…' : name;
        chip.classList.add('active');
        // 取消其他芯片选中
        document.querySelectorAll('.brand-chip').forEach(c => {
            if (c.id !== 'brandOther') c.classList.remove('active');
        });
        // 高亮下拉选项
        document.querySelectorAll('.brand-option').forEach(o => {
            o.classList.toggle('selected', o.textContent === name);
        });
        closeAllDropdowns();
    }

    // ===== 品牌芯片点击 =====
    function selectBrand(el) {
        closeAllDropdowns();
        document.querySelectorAll('.brand-chip').forEach(c => c.classList.remove('active'));
        el.classList.add('active');
        currentBrand = el.dataset.brand;
        currentBrandName = '';
        // 恢复"其他"芯片文字
        document.getElementById('brandOther').textContent = '其他';
    }

    // ===== 关闭所有下拉 =====
    function closeAllDropdowns() {
        document.querySelectorAll('.brand-dropdown').forEach(d => d.classList.remove('show'));
    }

    // ===== 点击页面其他区域关闭下拉 =====
    document.addEventListener('click', closeAllDropdowns);

    // ===== 场景切换 =====
    document.getElementById('sceneGrid').addEventListener('click', (e) => {
        const card = e.target.closest('.scene-card');
        if (!card) return;
        document.querySelectorAll('.scene-card').forEach(c => c.classList.remove('active'));
        card.classList.add('active');
        currentScene = card.dataset.scene;
    });

    // ===== 字数统计 =====
    const inputText = document.getElementById('inputText');
    const charCount = document.getElementById('charCount');

    inputText.addEventListener('input', () => {
        charCount.textContent = inputText.value.length + ' 字';
    });

    // ===== Toast =====
    function showToast(msg) {
        const t = document.getElementById('toast');
        t.textContent = msg;
        t.classList.add('show');
        setTimeout(() => t.classList.remove('show'), 2000);
    }

    // ===== 复制 =====
    function handleCopy() {
        if (!resultText) return;
        navigator.clipboard.writeText(resultText).then(() => {
            showToast('✅ 已复制到剪贴板');
        }).catch(() => {
            // fallback
            const ta = document.createElement('textarea');
            ta.value = resultText;
            document.body.appendChild(ta);
            ta.select();
            document.execCommand('copy');
            document.body.removeChild(ta);
            showToast('✅ 已复制到剪贴板');
        });
    }

    // ===== 优化主逻辑 =====
    async function handleOptimize() {
        const text = inputText.value.trim();
        if (!text) {
            showToast('请先输入需要优化的文稿');
            return;
        }
        if (isOptimizing) return;
        isOptimizing = true;

        const btn = document.getElementById('btnOptimize');
        btn.disabled = true;
        btn.innerHTML = '优化中 <span class="btn-arrow" style="animation: bounce 0.6s infinite;">⚡</span>';

        const overlay = document.getElementById('loadingOverlay');
        overlay.classList.add('show');

        // 模拟 AI 思考延迟
        await new Promise(r => setTimeout(r, 800 + Math.random() * 700));

        // 执行风格转换
        resultText = convertToBrandStyle(text, currentBrand, currentScene);

        overlay.classList.remove('show');

        // 打字机效果输出
        await typewriterOutput(resultText);

        btn.disabled = false;
        btn.innerHTML = '开始优化 <span class="btn-arrow">→</span>';
        isOptimizing = false;

        document.getElementById('btnCopy').style.display = 'inline-flex';
        document.getElementById('outputCharCount').textContent = resultText.length + ' 字';
    }

    // ===== 打字机输出 =====
    async function typewriterOutput(text) {
        const area = document.getElementById('outputArea');
        area.innerHTML = '';
        area.classList.add('typing-cursor');

        const chars = [...text];
        let displayed = '';
        const chunkSize = 3;

        for (let i = 0; i < chars.length; i += chunkSize) {
            const chunk = chars.slice(i, i + chunkSize).join('');
            displayed += chunk;
            area.textContent = displayed;
            area.scrollTop = area.scrollHeight;
            await new Promise(r => setTimeout(r, 18));
        }

        area.classList.remove('typing-cursor');

        // 最终渲染带高亮的版本
        area.innerHTML = highlightResult(resultText);
    }

    // ===== 结果高亮 =====
    function highlightResult(text) {
        // 高亮骞总标志性口头禅
        const phrases = [
            '说实话', '负责任地说', '你们说', '咱就是说',
            '不能说[^，]+，只能说', '在中国为中国向全球',
            '最后真正赢的', '咱们的消费者'
        ];
        let html = escapeHtml(text);

        // 高亮数据（数字+单位）
        html = html.replace(/(\d+[\.\d]*)([%万台亿公里月年个辆元]+)/g,
            '<span class="hl-data">$1$2</span>');

        // 高亮核心口头禅
        html = html.replace(/(说实话|负责任地说|你们说|咱就是说|在中国为中国向全球|咱们的消费者)/g,
            '<span class="hl-phrase">$1</span>');

        return html;
    }

    function escapeHtml(text) {
        const d = document.createElement('div');
        d.textContent = text;
        return d.innerHTML;
    }

    // ===== 核心风格转换引擎（品牌感知）=====
    function convertToBrandStyle(text, brand, scene) {
        // 第一步：基础书面语 → 口语化替换
        let r = text;

        const replacements = [
            [/(?:我们|我司|本公司)(?:非常|十分|特别)?(?:认同|认可|赞同)/g, '说实话'],
            [/(?:请|希望|恳请)(?:大家|各位|您)(?:判断|评价|考量)/g, '你们说'],
            [/(?:不仅|不单)[^，。]+而且[^，。]+(?:雷同|相似|一致|相同)/g, '不能说相似，只能说一模一样'],
            [/(?:我们|本公司)(?:受益匪浅|获益良多|深受其益)/g, '我们也是受益者'],
            [/(?:欢迎|期待)(?:大家|各位)(?:交流|沟通|探讨)/g, '拉个群好好交流交流'],
            [/(?:我(?:非常|十分)?(?:高兴|荣幸|开心)(?:地)?(?:宣布|告诉|分享))/g, '说实话'],
            [/(?:我(?:们)?(?:认为|觉得|以为)(?:品质|质量)(?:非常|十分)?(?:重要|关键|核心))/g, '三电终身质保，敢写进合同才算数'],
            [/(?:感谢(?:大家|各位|您)(?:的)?(?:关注|支持|关心))/g, '今天关注到相关情况，收到很多朋友问询'],
            [/(?:与竞品相比(?:各有|均具)(?:优势|亮点))/g, '1.5T对1.5L，高速上踩一脚就知道'],
            [/(?:我们(?:希望|致力于|专注于)(?:为消费者|给用户)(?:创造|提供)(?:价值|更好))/g, '在中国为中国向全球，最后真正赢的，永远是咱们的消费者'],
            [/(?:请(?:各位|大家)(?:媒体|老师)(?:多)?(?:支持|关注|指教))/g, '你们说，这要是A股该多好啊'],
            [/(?:产品(?:非常|十分)?(?:优秀|出色|卓越))/g, '全网搜，只此一台'],
            [/(?:续航(?:里程)?(?:很长|很远|出色))/g, '续航直接拉满，310公里纯电——你们算算，够不够来回'],
            [/(?:智能(?:座舱|化)?(?:体验|表现)(?:很好|出色|优秀))/g, '智能化领先一个代际'],
            [/(?:(?:欢?迎|期待)(?:大家|各位)?(?:购买|选购|体验))/g, '你们说，这怎么选？'],
            [/(?:(?:价格|售价)(?:合理|实惠|优惠|亲民))/g, '价格？16.99万，你们算算这笔账'],
            [/(?:性能(?:表现)?(?:出色|优秀|强劲))/g, '动力更强、跑得更远，高速上踩一脚就知道'],
            [/(?:(?:品质|质量)(?:可靠|过硬|有保障))/g, '真技术、真品质、真诚意，才是硬通货'],
            [/(?:技术(?:领先|先进|创新))/g, '领先一个代际，也领先友商12-18个月'],
            [/(?:团队(?:优秀|强大|出色|有能力))/g, '敢拼敢冲、不服输的团队'],
            [/(?:销量(?:很好|增长|提升|突破))/g, '订单直接飙上来了'],
            [/(?:市场(?:表现|份额)(?:良好|领先|优秀))/g, '市场不等人，订单说明一切'],
            [/(?:(?:诚邀|邀请|欢迎)(?:莅临|参加|参与)(?:体验|试驾))/g, '别光听我说，开一圈就知道'],
            [/(?:服务(?:周到|贴心|完善|优质))/g, '用服务赢订单，用实干赢信任'],
            [/(?:我们(?:将)?(?:继续|持续)(?:努力|奋进|前行))/g, '不玩虚的，不负用户'],
        ];

        for (const [pattern, replacement] of replacements) {
            r = r.replace(pattern, replacement);
        }

        // 第二步：按品牌微调口头禅
        r = applyBrandTone(r, brand);

        // 第三步：按场景做结构调整
        switch (scene) {
            case 'launch':
                r = structureLaunch(r, brand);
                break;
            case 'media':
                r = structureMedia(r, brand);
                break;
            case 'mobilize':
                r = structureMobilize(r);
                break;
            case 'social':
                r = structureSocial(r);
                break;
        }

        // 第四步：收尾润色
        r = finalPolish(r, scene);

        return r;
    }

    // ===== 品牌语气微调 =====
    function applyBrandTone(text, brand) {
        // 解析品牌名（支持 "other:品牌名" 格式）
        let brandDisplayName = '';
        if (brand && brand.startsWith('other:')) {
            brandDisplayName = brand.replace('other:', '');
        } else {
            const brandNames = {
                dfrq: '东风日产',
                dfms: '东风猛士',
                yipai: '奕派',
                dongfeng: '东风集团',
                lantuo: '岚图',
                changan: '长安启源',
                gqhaobo: '广汽昊铂',
                '': ''
            };
            brandDisplayName = brandNames[brand] || '';
        }
        // 在结尾适当位置自然带入品牌名（避免过度）
        return text;
    }

    // ===== 发布会场景 =====
    function structureLaunch(text, brand) {
        const sentences = text.split(/[。！？]/).filter(s => s.trim());
        if (sentences.length <= 1) {
            return '负责任地说，' + text.replace(/。$/, '') + '——你们说，这怎么选？';
        }
        let result = '';
        result += sentences[0].trim() + '——你们说，这算不算硬实力？\n\n';
        for (let i = 1; i < sentences.length - 1; i++) {
            result += sentences[i].trim() + '。';
        }
        if (sentences.length > 1) {
            const last = sentences[sentences.length - 1].trim();
            result += '\n\n' + last + '——你们说，这怎么选？';
        }
        return result;
    }

    // ===== 媒体沟通采访场景 =====
    function structureMedia(text, brand) {
        let result = '说实话，全员牛马，谁也别笑话谁。\n\n';
        result += text + '\n\n';
        result += '咱就是说，主打一个听劝、善改。比起一夜爆红，我们更想慢慢走、走得远。\n\n';
        result += '好了，打住，再说下去就不礼貌了。';
        return result;
    }

    // ===== 内宣动员场景 =====
    function structureMobilize(text) {
        const sentences = text.split(/[。！？]/).filter(s => s.trim());
        let result = '正式开战！大家，准备好了没有？！\n\n';
        result += '因为，' + (sentences[0] || '我们有真产品') + '！\n';
        if (sentences.length > 1) {
            result += '因为，' + (sentences[1] || '我们有真底气') + '！\n';
        }
        if (sentences.length > 2) {
            result += '因为，' + (sentences[2] || '我们有敢拼的团队') + '！\n';
        }
        result += '\n';
        result += '不摆架子、不喊口号，用实干赢信任，用服务赢订单！\n\n';
        result += '现在！立刻！开干！';
        return result;
    }

    // ===== 新媒体文案场景 =====
    function structureSocial(text) {
        let result = text.replace(/。$/, '') + '——你们说？\n\n[微笑]';
        return result;
    }

    // ===== 收尾润色 =====
    function finalPolish(text, scene) {
        let r = text;

        // 添加反问标点
        r = r.replace(/——你们说[，？]?$/gm, '——你们说？');
        r = r.replace(/——你们说，这怎么选[？]?$/gm, '——你们说，这怎么选？');

        // 确保感叹号在动员场景充足
        if (scene === 'mobilize') {
            r = r.replace(/开干$/gm, '开干！');
        }

        // 新媒体文案场景加微笑
        if (scene === 'social' && !r.includes('[微笑]')) {
            r = r.trimEnd() + ' [微笑]';
        }

        // 清理多余空白
        r = r.replace(/\n{3,}/g, '\n\n').trim();

        return r;
    }

    // ===== 示例文本 =====
    const examples = {
        launch: '我们的新能源SUV产品非常优秀，续航里程很长，智能座舱体验很好，价格也很合理，欢迎大家购买。',
        media: '我们最近工作很忙，发布了很多新产品，希望大家继续支持我们，关注我们的品牌。',
        mobilize: '我们的团队很优秀，产品很有竞争力，大家要努力提升销量，服务好客户。',
        social: '我们新产品的智能化体验很好，续航也很长，价格很实惠，大家快来看看。'
    };

    // 双击输入框填入示例
    // ===== 页面初始化 =====
    initBrandDropdown();
    currentBrand = 'dfrq';
    currentBrandName = '东风日产';

    inputText.addEventListener('dblclick', () => {
        if (!inputText.value.trim()) {
            inputText.value = examples[currentScene] || examples.launch;
            charCount.textContent = inputText.value.length + ' 字';
            showToast('💡 已填入示例文本');
        }
    });
    </script>
</body>
