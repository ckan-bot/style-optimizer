<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文稿风格优化器 · 高管风格</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg: #f8f9fc;
            --card: #ffffff;
            --primary: #c41230;
            --primary-light: #e8354a;
            --primary-dark: #9a0e26;
            --accent: #1a1a2e;
            --text: #2d2d3a;
            --text-secondary: #6b7280;
            --border: #e5e7eb;
            --shadow: 0 4px 24px rgba(0,0,0,0.06);
            --shadow-lg: 0 12px 40px rgba(196,18,48,0.12);
            --radius: 16px;
            --radius-sm: 10px;
            /* 蓝色选中态 */
            --select: #2563eb;
            --select-light: #3b82f6;
            --select-bg: rgba(37,99,235,0.04);
        }

        body {
            font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* ===== 背景装饰 ===== */
        .bg-decor {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }
        .bg-decor::before {
            content: '';
            position: absolute;
            top: -20%; right: -10%;
            width: 600px; height: 600px;
            background: radial-gradient(circle, rgba(196,18,48,0.06) 0%, transparent 70%);
            border-radius: 50%;
        }
        .bg-decor::after {
            content: '';
            position: absolute;
            bottom: -10%; left: -5%;
            width: 400px; height: 400px;
            background: radial-gradient(circle, rgba(26,26,46,0.04) 0%, transparent 70%);
            border-radius: 50%;
        }

        /* ===== Header ===== */
        header {
            position: relative;
            z-index: 10;
            padding: 32px 40px 0;
        }
        .header-inner {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .logo-group {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .logo-icon {
            width: 48px; height: 48px;
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            border-radius: 14px;
            display: flex; align-items: center; justify-content: center;
            font-size: 22px;
            color: white;
            box-shadow: 0 4px 16px rgba(196,18,48,0.25);
        }
        .logo-text h1 {
            font-size: 22px;
            font-weight: 900;
            color: var(--accent);
            letter-spacing: -0.5px;
        }
        .logo-text p {
            font-size: 12px;
            color: var(--text-secondary);
            font-weight: 400;
            margin-top: 2px;
        }
        .badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 14px;
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            color: white;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
        }

        /* ===== Main ===== */
        main {
            position: relative;
            z-index: 10;
            max-width: 1200px;
            margin: 0 auto;
            padding: 32px 40px 60px;
        }

        /* ===== 人设选择 ===== */
        .scene-section {
            margin-bottom: 28px;
        }
        .scene-label {
            font-size: 14px;
            font-weight: 700;
            color: var(--text-secondary);
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .scene-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }
        @media (max-width: 640px) {
            .scene-grid { grid-template-columns: repeat(2, 1fr); }
        }
        .scene-card {
            position: relative;
            padding: 14px 16px 12px;
            background: var(--card);
            border: 2px solid var(--border);
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.4,0,0.2,1);
            user-select: none;
        }
        .scene-card:hover {
            border-color: var(--select-light);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(37,99,235,0.1);
        }
        .scene-card.active {
            border-color: var(--select);
            background: linear-gradient(135deg, rgba(37,99,235,0.06), rgba(37,99,235,0.02));
            box-shadow: 0 4px 16px rgba(37,99,235,0.12);
        }
        .scene-card.active::after {
            content: '✓';
            position: absolute;
            top: 8px; right: 10px;
            width: 20px; height: 20px;
            background: var(--select);
            color: white;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 11px;
            font-weight: 700;
        }
        .scene-card .scene-emoji {
            font-size: 22px;
            margin-bottom: 5px;
        }
        .scene-card .scene-name {
            font-size: 13px;
            font-weight: 700;
            color: var(--text);
            margin-bottom: 4px;
        }
        .scene-card .scene-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            margin-top: 5px;
        }
        .scene-card .scene-tag {
            display: inline-block;
            padding: 2px 7px;
            background: rgba(37,99,235,0.07);
            color: var(--select);
            border-radius: 20px;
            font-size: 10px;
            font-weight: 600;
        }
        .scene-card.active .scene-tag {
            background: rgba(37,99,235,0.14);
        }
        .brand-chip {
            padding: 8px 20px;
            background: var(--card);
            border: 2px solid var(--border);
            border-radius: 50px;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.2s;
            user-select: none;
        }
        .brand-chip:hover {
            border-color: var(--select-light);
            color: var(--select);
        }
        .brand-chip.active {
            background: var(--select);
            border-color: var(--select);
            color: white;
            box-shadow:0 4px 16px rgba(37,99,235,0.25);
        }
        .brand-dropdown-wrap {
            position: relative;
            display: inline-flex;
        }
        .brand-dropdown {
            display: none;
            position: absolute;
            top: calc(100% + 8px);
            left: 50%;
            transform: translateX(-50%);
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            box-shadow: 0 8px 32px rgba(0,0,0,0.12);
            z-index: 100;
            max-height: 280px;
            overflow-y: auto;
            min-width: 180px;
            padding: 6px 0;
        }
        .brand-dropdown.show {
            display: block;
        }
        .brand-dropdown::-webkit-scrollbar { width: 5px; }
        .brand-dropdown::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 3px; }
        .brand-option {
            padding: 8px 18px;
            font-size: 13px;
            color: var(--text);
            cursor: pointer;
            white-space: nowrap;
            transition: background 0.15s;
        }
        .brand-option:hover {
            background: rgba(37,99,235,0.08);
            color: var(--select);
        }
        .brand-option.selected {
            background: rgba(37,99,235,0.12);
            color: var(--select);
            font-weight: 600;
        }
        .brand-chip.has-dropdown::after {
            content: '▾';
            margin-left: 6px;
            font-size: 11px;
        }

        /* ===== 编辑器 ===== */
        .editor-stack {
            display: flex;
            flex-direction: column;
            gap: 0;
        }

        .editor-panel {
            background: var(--card);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        .panel-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 22px;
            border-bottom: 1px solid var(--border);
        }
        .panel-title {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            font-weight: 700;
            color: var(--text);
        }
        .panel-title .dot {
            width: 8px; height: 8px;
            border-radius: 50%;
        }
        .input-dot { background: var(--primary); }
        .output-dot { background: #10b981; }
        .char-count {
            font-size: 12px;
            color: var(--text-secondary);
            font-variant-numeric: tabular-nums;
        }

        textarea {
            width: 100%;
            min-height: 320px;
            padding: 20px 22px;
            border: none;
            outline: none;
            resize: vertical;
            font-family: inherit;
            font-size: 15px;
            line-height: 1.8;
            color: var(--text);
            background: transparent;
        }
        textarea::placeholder {
            color: #c5c8d0;
        }

        .output-area {
            min-height: 320px;
            padding: 20px 22px;
            font-size: 15px;
            line-height: 1.9;
            color: var(--text);
            overflow-y: auto;
            white-space: pre-wrap;
        }
        .output-placeholder {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 300px;
            color: #c5c8d0;
            text-align: center;
        }
        .output-placeholder .ph-icon {
            font-size: 48px;
            margin-bottom: 12px;
            opacity: 0.5;
        }
        .output-placeholder .ph-text {
            font-size: 14px;
            line-height: 1.6;
        }

        /* ===== 按钮 ===== */
        .action-bar {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
            padding: 20px 0;
        }
        .btn-optimize {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 16px 48px;
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            color: white;
            border: none;
            border-radius: 50px;
            font-size: 16px;
            font-weight: 700;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4,0,0.2,1);
            box-shadow: 0 6px 24px rgba(196,18,48,0.3);
            position: relative;
            overflow: hidden;
        }
        .btn-optimize::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, transparent, rgba(255,255,255,0.15));
            opacity: 0;
            transition: opacity 0.3s;
        }
        .btn-optimize:hover::before { opacity: 1; }
        .btn-optimize:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 32px rgba(196,18,48,0.4);
        }
        .btn-optimize:active {
            transform: translateY(0);
        }
        .btn-optimize:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        .btn-optimize .btn-arrow {
            transition: transform 0.3s;
        }
        .btn-optimize:hover .btn-arrow {
            transform: translateX(3px);
        }

        .btn-copy {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 16px 32px;
            background: var(--card);
            color: var(--text);
            border: 2px solid var(--border);
            border-radius: 50px;
            font-size: 14px;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.25s;
        }
        .btn-copy:hover {
            border-color: var(--primary);
            color: var(--primary);
            transform: translateY(-1px);
        }

        /* ===== 加载动画 ===== */
        .loading-overlay {
            display: none;
            position: absolute;
            inset: 0;
            background: rgba(255,255,255,0.85);
            backdrop-filter: blur(4px);
            z-index: 20;
            align-items: center;
            justify-content: center;
            border-radius: var(--radius);
        }
        .loading-overlay.show {
            display: flex;
        }
        .spinner {
            display: flex;
            gap: 6px;
        }
        .spinner span {
            width: 10px; height: 10px;
            background: var(--primary);
            border-radius: 50%;
            animation: bounce 1.2s infinite ease-in-out;
        }
        .spinner span:nth-child(2) { animation-delay: 0.15s; }
        .spinner span:nth-child(3) { animation-delay: 0.3s; }
        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0.5); opacity: 0.4; }
            40% { transform: scale(1); opacity: 1; }
        }

        /* ===== 结果高亮 ===== */
        .hl-phrase {
            color: var(--primary);
            font-weight: 700;
        }
        .hl-data {
            background: rgba(196,18,48,0.08);
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: 600;
        }

        /* ===== Toast ===== */
        .toast {
            position: fixed;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%) translateY(80px);
            background: var(--accent);
            color: white;
            padding: 12px 28px;
            border-radius: 50px;
            font-size: 14px;
            font-weight: 500;
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.4,0,0.2,1);
            z-index: 999;
            pointer-events: none;
        }
        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* ===== 打字动画 ===== */
        .typing-cursor::after {
            content: '|';
            color: var(--primary);
            font-weight: 300;
            animation: blink 0.8s infinite;
        }
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        /* ===== 响应式 ===== */
        @media (max-width: 640px) {
            header, main { padding-left: 20px; padding-right: 20px; }
            .header-inner { flex-direction: column; align-items: flex-start; gap: 12px; }
            .scene-grid { grid-template-columns: 1fr 1fr; }
            .btn-optimize { padding: 14px 32px; font-size: 15px; }
        }
    </style>
</head>
<body>
    <div class="bg-decor"></div>

    <header>
        <div class="header-inner">
            <div class="logo-group">
                <div class="logo-icon">✍️</div>
                <div class="logo-text">
                    <h1>文稿风格优化器</h1>
                    <p>一键对齐高管视角 &amp; 品牌风格</p>
                </div>
            </div>
            <div class="badge">
                <span>🔥</span>
                <span>专为车企高管打造的内容智造引擎</span>
            </div>
        </div>
    </header>

    <main>
        <!-- 品牌选择 -->
        <div class="brand-section" style="margin-bottom: 28px;">
            <div class="scene-label">选择品牌</div>
            <div style="display:flex; gap:10px; flex-wrap:wrap; align-items:flex-start;" id="brandBar">
                <div class="brand-chip active" data-brand="dfrq" onclick="selectBrand(this)">东风日产</div>
                <div class="brand-chip" data-brand="dfms" onclick="selectBrand(this)">东风猛士</div>
                <div class="brand-chip" data-brand="yipai" onclick="selectBrand(this)">奕派科技</div>
                <div class="brand-chip" data-brand="dongfeng" onclick="selectBrand(this)">东风集团</div>
                <div class="brand-chip" data-brand="lantuo" onclick="selectBrand(this)">岚图汽车</div>
                <div class="brand-chip" data-brand="changan" onclick="selectBrand(this)">长安启源</div>
                <div class="brand-chip" data-brand="gqhaobo" onclick="selectBrand(this)">广汽昊铂</div>
                <div class="brand-dropdown-wrap">
                    <div class="brand-chip has-dropdown" data-brand="other" id="brandOther" onclick="toggleBrandDropdown(event)">其他</div>
                    <div class="brand-dropdown" id="brandDropdown"></div>
                </div>
            </div>
        </div>

        <!-- 人设选择 -->
        <div class="scene-section">
            <div class="scene-label">选择人设</div>
            <div class="scene-grid" id="sceneGrid">
                <div class="scene-card active" data-scene="macro">
                    <div class="scene-emoji">🌐</div>
                    <div class="scene-name">格局领航型</div>
                    <div class="scene-tags">
                        <span class="scene-tag">站位高</span>
                        <span class="scene-tag">谈行业</span>
                        <span class="scene-tag">讲趋势</span>
                    </div>
                </div>
                <div class="scene-card" data-scene="tech">
                    <div class="scene-emoji">🔧</div>
                    <div class="scene-name">技术理工派</div>
                    <div class="scene-tags">
                        <span class="scene-tag">讲参数</span>
                        <span class="scene-tag">聊技术</span>
                        <span class="scene-tag">重品质</span>
                    </div>
                </div>
                <div class="scene-card" data-scene="bold">
                    <div class="scene-emoji">🔥</div>
                    <div class="scene-name">热血敢言型</div>
                    <div class="scene-tags">
                        <span class="scene-tag">态度鲜明</span>
                        <span class="scene-tag">自信张扬</span>
                        <span class="scene-tag">有记忆点</span>
                    </div>
                </div>
                <div class="scene-card" data-scene="warm">
                    <div class="scene-emoji">🤝</div>
                    <div class="scene-name">亲和温情派</div>
                    <div class="scene-tags">
                        <span class="scene-tag">接地气</span>
                        <span class="scene-tag">懂用户</span>
                        <span class="scene-tag">有共情力</span>
                    </div>
                </div>
                <div class="scene-card" data-scene="meme">
                    <div class="scene-emoji">😄</div>
                    <div class="scene-name">幽默玩梗派</div>
                    <div class="scene-tags">
                        <span class="scene-tag">会互动</span>
                        <span class="scene-tag">懂玩梗</span>
                        <span class="scene-tag">轻松不严肃</span>
                    </div>
                </div>
                <div class="scene-card" data-scene="steady">
                    <div class="scene-emoji">🎩</div>
                    <div class="scene-name">传统稳重派</div>
                    <div class="scene-tags">
                        <span class="scene-tag">谦和有礼</span>
                        <span class="scene-tag">不激进</span>
                        <span class="scene-tag">温润得体</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- 编辑器（上下布局） -->
        <div class="editor-stack">
            <div class="editor-panel">
                <div class="panel-header">
                    <div class="panel-title">
                        <span class="dot input-dot"></span>
                        原始文稿
                    </div>
                    <span class="char-count" id="charCount">0 字</span>
                </div>
                <textarea id="inputText" placeholder="在这里粘贴需要优化的文稿……&#10;&#10;例如：我们的产品非常优秀，续航里程很长，智能座舱体验很好，欢迎大家购买。"></textarea>
            </div>

            <!-- 操作按钮（在输入框和结果框之间） -->
            <div class="action-bar">
                <button class="btn-optimize" id="btnOptimize" onclick="handleOptimize()">
                    开始优化
                    <span class="btn-arrow">→</span>
                </button>
                <button class="btn-copy" id="btnCopy" onclick="handleCopy()" style="display:none;">
                    📋 复制结果
                </button>
            </div>

            <div class="editor-panel" style="position:relative;">
                <div class="panel-header">
                    <div class="panel-title">
                        <span class="dot output-dot"></span>
                        高管风格优化输出
                    </div>
                    <span class="char-count" id="outputCharCount">0 字</span>
                </div>
                <div class="output-area" id="outputArea">
                    <div class="output-placeholder">
                        <div class="ph-icon">🎯</div>
                        <div class="ph-text">选择品牌和场景，输入文稿<br>点击上方按钮，一键对齐高管风格</div>
                    </div>
                </div>
                <div class="loading-overlay" id="loadingOverlay">
                    <div class="spinner">
                        <span></span><span></span><span></span>
                    </div>
                </div>
            </div>
        </div>

    </main>

    <!-- Toast -->
    <div class="toast" id="toast"></div>

    <script>
    // ===== 全局状态 =====
    let currentBrand = 'dfrq';
    let currentBrandName = '东风日产';
    let currentScene = 'macro';
    let isOptimizing = false;
    let resultText = '';
    let optimizationCount = 0;   // 追踪对同一段文本的重复优化次数
    let lastInputHash = '';       // 追踪输入是否变化

    // ====================================================================
    //  东风日产品牌 DNA —— 仅在 brand==='dfrq' 时启用
    // ====================================================================
    const dfrqDNA = {
        // 品牌专属词汇替换（通用书面语 → 东风日产风格词）
        vocab: [
            [/产品很有竞争力/g, '合资新势力，行业新实力'],
            [/技术领先/g, '技术日产，人·车·生活'],
            [/续航表现优秀/g, '续航安心，远行无忧'],
            [/智能化体验领先/g, '智能舒适，就选东风日产'],
            [/品质有保障/g, '大厂品质，安心靠谱'],
            [/性能表现强劲/g, '天演架构赋能，性能越级'],
            [/销量持续提升/g, '1700万用户信赖，口碑是最好的销量'],
            [/服务完善/g, '以"山姆式体验"打磨每一次服务'],
            [/我们会持续努力/g, '尽兴由NI，不负期待'],
            [/欢迎大家体验/g, '欢迎大家来试驾，NI好！'],
            [/我们认为/g, '东风日产始终认为'],
        ],
        // 人设专属品牌金句库（按 persona 分组）
        personaPhrases: {
            macro: [
                '在中国，为中国，向全球',
                '合资新势力，行业新实力',
                '让"在中国，为世界"不再是一句口号，而是每一步践行的承诺',
            ],

    function selectOtherBrand(name) {
        currentBrand = 'other:' + name;

        chip.classList.add('active');

        document.querySelectorAll('.brand-option').forEach(o => {
            o.classList.toggle('selected', o.textContent === name);
        });

    // ====================================================================
    //  优化主逻辑
    // ====================================================================
    async function handleOptimize() {
        const text = inputText.value.trim();
        if (!text) { showToast('请先输入需要优化的文稿'); return; }
        if (isOptimizing) return;
        isOptimizing = true;

        // 判断是否是对同一段文本的重新优化
        const hash = simpleHash(text + currentBrand + currentScene);
        if (hash === lastInputHash) {
            optimizationCount++;
        } else {
            optimizationCount = 0;
            lastInputHash = hash;
        }

        const btn = document.getElementById('btnOptimize');
        btn.disabled = true;
        btn.innerHTML = '优化中 <span class="btn-arrow" style="animation: bounce 0.6s infinite;">⚡</span>';

        const overlay = document.getElementById('loadingOverlay');
        overlay.classList.add('show');

        // 模拟 AI 思考延迟
        await new Promise(r => setTimeout(r, 1000 + Math.random() * 800));

        // 执行风格转换
        resultText = convertToBrandStyle(text, currentBrand, currentScene, optimizationCount);

        overlay.classList.remove('show');

        // 打字机效果输出
        await typewriterOutput(resultText);

        btn.disabled = false;
        btn.innerHTML = optimizationCount > 0
            ? '重新优化 <span class="btn-arrow">→</span>'
            : '开始优化 <span class="btn-arrow">→</span>';
        isOptimizing = false;

        document.getElementById('btnCopy').style.display = 'inline-flex';
        document.getElementById('outputCharCount').textContent = resultText.length + ' 字';
    }

    function simpleHash(str) {
        let h = 0;
        for (let i = 0; i < str.length; i++) { h = ((h << 5) - h + str.charCodeAt(i)) | 0; }
        return h;
    }

    // ====================================================================
    //  打字机输出
    // ====================================================================
    async function typewriterOutput(text) {
        const area = document.getElementById('outputArea');
        area.innerHTML = '';
        area.classList.add('typing-cursor');
        const chars = [...text];
        let displayed = '';
        const chunkSize = 3;
        for (let i = 0; i < chars.length; i += chunkSize) {
            displayed += chars.slice(i, i + chunkSize).join('');
            area.textContent = displayed;
            area.scrollTop = area.scrollHeight;
            await new Promise(r => setTimeout(r, 18));
        }
        area.classList.remove('typing-cursor');
        area.innerHTML = highlightResult(resultText);
    }

    // ====================================================================
    //  结果高亮
    // ====================================================================
    function highlightResult(text) {
        let html = escapeHtml(text);
        html = html.replace(/(\d+[\.\d]*)([%万台亿公里月年个辆元度牛]+|N·m|kW|Wh|kg|mm|V)/g,
            '<span class="hl-data">$1$2</span>');
        const phrases = [
            '说实话','负责任地说','你们说','用数据说话','感谢大家','不负期待',
            '好家伙','在中国为中国向全球','尽兴由NI','合资新势力','技术日产',
            'NI好','人·车·生活','最家','安心靠谱','必须配','绝配',
            '神马都不怕','山姆式','沙发厂','科技灯厂','行业新实力',
        ];
        const re = new RegExp('(' + phrases.map(p => p.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('|') + ')', 'g');
        html = html.replace(re, '<span class="hl-phrase">$1</span>');
        return html;
    }

    function escapeHtml(text) {
        const d = document.createElement('div');
        d.textContent = text;
        return d.innerHTML;
    }

    // ====================================================================
    //  核心风格转换引擎
    //  规则：
    //    1. 东风日产 → 先叠加品牌 DNA，再按人设微调
    //    2. 其他品牌 → 仅按人设转换
    //    3. 最后校对润色（错别字/语病/衔接）
    // ====================================================================
    function convertToBrandStyle(text, brand, persona, variation) {
        let r = text;
        const isDfrq = (brand === 'dfrq');
        const v = variation || 0;   // 变体序号，用于重新优化

        // ---- 第一步：通用书面语 → 半口语化预处理 ----
        r = preProcess(r);

        // ---- 第二步：如果是东风日产，叠加品牌 DNA ----
        if (isDfrq) {
            r = applyDfrqBrandDNA(r, persona);
        }

        // ---- 第三步：按人设深度风格塑造 ----
        switch (persona) {
            case 'macro':  r = personaMacro(r, isDfrq, v);  break;
            case 'tech':   r = personaTech(r, isDfrq, v);   break;
            case 'bold':   r = personaBold(r, isDfrq, v);   break;
            case 'warm':   r = personaWarm(r, isDfrq, v);   break;
            case 'meme':   r = personaMeme(r, isDfrq, v);   break;
            case 'steady': r = personaSteady(r, isDfrq, v); break;
        }

        // ---- 第四步：校对润色 ----
        r = polishText(r, persona);

        // ---- 第五步：核心数据保护 ----
        r = preserveCoreData(text, r);

        return r;
    }

    // ====================================================================
    //  第一步：通用预处理（书面语 → 口语化）
    // ====================================================================
    function preProcess(text) {
        const reps = [
            [/(?:我们|我司|本公司)(?:非常|十分|特别)?(?:认同|认可|赞同)/g, '我们认为'],
            [/(?:请|希望|恳请)(?:大家|各位|您)(?:判断|评价|考量)/g, '大家可以判断'],
            [/(?:我们|本公司)(?:受益匪浅|获益良多|深受其益)/g, '我们也是受益者'],
            [/(?:欢迎|期待)(?:大家|各位)(?:交流|沟通|探讨)/g, '欢迎大家交流'],
            [/(?:感谢(?:大家|各位|您)(?:的)?(?:关注|支持|关心))/g, '感谢大家的关注'],
            [/(?:产品(?:非常|十分)?(?:优秀|出色|卓越))/g, '产品很有竞争力'],
            [/(?:续航(?:里程)?(?:很长|很远|出色))/g, '续航表现优秀'],
            [/(?:智能(?:座舱|化)?(?:体验|表现)(?:很好|出色|优秀))/g, '智能化体验领先'],
            [/(?:(?:欢?迎|期待)(?:大家|各位)?(?:购买|选购|体验))/g, '欢迎大家体验'],
            [/(?:性能(?:表现)?(?:出色|优秀|强劲))/g, '性能表现强劲'],
            [/(?:(?:品质|质量)(?:可靠|过硬|有保障))/g, '品质有保障'],
            [/(?:技术(?:领先|先进|创新))/g, '技术领先'],
            [/(?:销量(?:很好|增长|提升|突破))/g, '销量持续提升'],
            [/(?:服务(?:周到|贴心|完善|优质))/g, '服务完善'],
            [/(?:我们(?:将)?(?:继续|持续)(?:努力|奋进|前行))/g, '我们会持续努力'],
        ];
        let r = text;
        for (const [p, rep] of reps) r = r.replace(p, rep);
        return r;
    }

    // ====================================================================
    //  第二步：东风日产品牌 DNA 叠加
    // ====================================================================
    function applyDfrqBrandDNA(text, persona) {
        let r = text;
        // 应用品牌专属词汇替换
        for (const [pat, rep] of dfrqDNA.vocab) {
            r = r.replace(pat, rep);
        }
        return r;
    }

    // ---- 工具函数：将文本按句号/问号/感叹号拆分 ----
    function splitSentences(text) {
        return text.split(/([。！？])/).reduce((acc, cur, i, arr) => {
            if (i % 2 === 0 && cur.trim()) acc.push(cur.trim());
            return acc;
        }, []);
    }

    // ---- 工具函数：从数组中按变体选择 ----
    function pickVariant(arr, v) {
        return arr[v % arr.length];
    }

    // ===== 传统稳重派 =====

    // ====================================================================
    //  第四步：校对润色（错别字 / 语病 / 衔接 / 逻辑 / 口语化 / 数据保护）
    // ====================================================================
    function polishText(text, persona) {
        let r = text;

        // ---- 1. 错别字修正 ----
        const typoFixes = [
            [/做的好/g, '做得好'],
            [/的的/g, '的'],
            [/了了/g, '了'],
            [/我们我们/g, '我们'],
            [/产品产品/g, '产品'],
            [/非常非常/g, '非常'],
            [/已经已经/g, '已经'],
            [/继续继续/g, '继续'],
            [/不断不断/g, '不断'],
            [/提升提升/g, '提升'],
            [/优化优化/g, '优化'],
            [/极致极致/g, '极致'],
            [/卓越卓越/g, '卓越'],
            [/领先领先/g, '领先'],
            [/涉及到/g, '涉及'],
            [/进行着/g, '在进行'],
            [/(?<=[，。！？])\s{2,}/g, ' '],
            [/^\s+|\s+$/gm, ''],
        ];
        for (const [pat, rep] of typoFixes) {
            try { r = r.replace(pat, rep); } catch(e) {}
        }

        // ---- 2. 的/地/得 纠正 ----
        const deFixes = [
            [/认真的?说/g, '认真地说'],
            [/快的?跑/g, '快地跑'],
            [/努力的?工作/g, '努力地工作'],
            [/悄悄的?说/g, '悄悄地说'],
            [/大声的?宣布/g, '大声地宣布'],
        ];
        for (const [pat, rep] of deFixes) {
            try { r = r.replace(pat, rep); } catch(e) {}
        }

        // ---- 3. 标点规范 ----
        r = r.replace(/\.{3,}/g, '……');
        r = r.replace(/。。+/g, '。');
        r = r.replace(/！！+/g, '！');
        r = r.replace(/，，+/g, '，');
        r = r.replace(/,,+/g, '，');
        r = r.replace(/,,/g, '，');
        // 英文逗号 → 中文逗号（中文上下文中）
        r = r.replace(/([\u4e00-\u9fa5]),([\u4e00-\u9fa5])/g, '$1，$2');

        // ---- 4. 长句拆分（适合口头表达）----
        // 将超过32字的句子在逗号/分号/冒号处拆分，使节奏轻快
        const lines = r.split('\n');
        const newLines = [];
        for (const line of lines) {
            if (line.length <= 32) {
                newLines.push(line);
                continue;
            }
            const parts = line.split(/([，；：])/);
            let cur = '';
            for (const p of parts) {
                cur += p;
                if (cur.length >= 20 && /[，；：]/.test(p)) {
                    newLines.push(cur.trim());
                    cur = '';
                }
            }
            if (cur.trim()) newLines.push(cur.trim());
        }
        r = newLines.join('\n');

        // ---- 5. 语病修正 ----
        // "把...被..." 句式混乱
        r = r.replace(/把(.+?)被(.+?)了/g, '被$2把$1了');
        // 冗余"进行了"
        r = r.replace(/进行了(\S{1,4})的/g, '$1的');
        // 主语缺失修补（简单启发式）
        r = r.replace(/^([^，。！？]{2,8})，([^，。！？]{4,20}[。！？])/gm, (m, a, b) => {
            const subjects = ['我们', '我', '他们', '大家', '用户', '团队'];
            if (!subjects.some(s => a.startsWith(s) || b.startsWith(s))) {
                return '我们' + a + '，' + b;
            }
            return m;
        });

        // ---- 6. 逻辑衔接优化 ----
        const p = persona || 'macro';
        const transitions = {
            macro:  ['与此同时，', '从更广阔的视角看，', '值得关注的是，'],
            tech:   ['进一步来看，', '数据还显示，', '更重要的是，'],
            bold:   ['更重要的是，', '你们再看，', '说实话，'],
            warm:   ['与此同时，', '我们也注意到，', '值得一提的是，'],
            meme:   ['而且哦，', '你们看这个，', '还有更绝的——'],
            steady: ['此外，', '与此同时，', '在此基础上，'],
        };
        const tList = transitions[p] || transitions.macro;
        let tIdx = 0;
        r = r.replace(/\n\n(?=[\S])/g, () => {
            const t = tList[tIdx % tList.length];
            tIdx++;
            return '\n\n' + t;
        });

        // ---- 7. 去除冗余重复 ----
        const allLines = r.split('\n').filter(x => x.trim());
        const unique = [];
        for (const line of allLines) {
            const isDup = unique.some(u => {
                if (u === line) return true;
                const shorter = u.length < line.length ? u : line;
                const longer = u.length < line.length ? line : u;
                let common = 0;
                for (const c of shorter) { if (longer.includes(c)) common++; }
                return common > shorter.length * 0.5;
            });
            if (!isDup) unique.push(line);
        }
        r = unique.join('\n');

        // ---- 8. 最终清理 ----
        r = r.replace(/\n{3,}/g, '\n\n').trim();

        return r;
    }

    // ====================================================================
    //  核心数据保护（保留全部产品/销量/福利/服务/价格数据）
    // ====================================================================
    function preserveCoreData(inputText, outputText) {
        // 提取输入中的所有数字+单位
        const numPattern = /(\d+[\.\d]*\s*[%万台亿公里月年个辆元度牛VkWWhkg毫米]*)/g;
        const inputNums = [];
        let m;
        const clone = inputText;
        try {
            const re = new RegExp(numPattern.source, 'g');
            while ((m = re.exec(clone)) !== null) {
                inputNums.push(m[1].trim());
            }
        } catch(e) {}
        // 去重
        const uniqueNums = [...new Set(inputNums)];
        // 检查哪些在输出中缺失
        const missing = uniqueNums.filter(n => !outputText.includes(n));
        // 如果有缺失，附加在输出末尾（语言标记，方便人工核对）
        if (missing.length > 0) {
            outputText += '\n\n（⚠️ 以下核心数据未在输出中找到，请确认是否需要补充：' + missing.join('、') + '）';
        }
        return outputText;
    }

        meme:   '我们新产品的智能化体验很好，续航也很长，价格很实惠，大家快来看看。',
        steady: '我们非常感谢大家的关注，我们的产品质量可靠，服务优质，希望大家多多支持。',
    };
